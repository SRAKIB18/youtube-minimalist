<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Minimalist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h3>YouTube Focus</h3>
        <span class="version-tag">v1.1</span>
      </div>
    </div>
    <div class="status-pill" id="statusBadge">
      <span class="status-dot"></span>
      <span class="status-text">ACTIVE</span>
    </div>
  </div>

  <div class="controls-list">
    <!-- Option 1: Hide Feed -->
    <div class="control-card">
      <label class="switch-container">
        <div class="label-info">
          <span class="label-title">Hide Home Feed</span>
          <span class="label-desc">Removes thumbnails & algorithmic feed</span>
        </div>
        <input type="checkbox" id="toggleFeed" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Option 2: Hide Shorts -->
    <div class="control-card">
      <label class="switch-container">
        <div class="label-info">
          <span class="label-title">Block Shorts & Reels</span>
          <span class="label-desc">Hides shelves & sidebar shortcuts</span>
        </div>
        <input type="checkbox" id="toggleShorts" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Option 3: Daily Hadith -->
    <div class="control-card">
      <label class="switch-container">
        <div class="label-info">
          <span class="label-title">Daily Hadith (হাদিস ও বাণী)</span>
          <span class="label-desc">Shows inspiring Hadith on homepage</span>
        </div>
        <input type="checkbox" id="toggleQuotes" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <div class="shortcut-tip">
      <kbd>/</kbd> <span>to search instantly on YouTube</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
