<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Minimalist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h3>YouTube Focus</h3>
        <span class="version-tag">v1.3</span>
      </div>
    </div>
    <div class="status-pill" id="statusBadge">
      <span class="status-dot"></span>
      <span class="status-text">ACTIVE</span>
    </div>
  </div>

  <!-- Time Manager Widget (Option C) -->
  <div class="time-card">
    <div class="time-card-top">
      <div class="time-title-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="time-card-label">Today on YouTube</span>
      </div>
      <span class="time-card-value" id="todayTimeDisplay">0m</span>
    </div>
    <div class="time-bar-bg">
      <div class="time-bar-fill" id="timeBarFill" style="width: 0%;"></div>
    </div>
    <div class="time-card-footer">
      <span id="sessionTimeText">Session: 0m</span>
      <span id="dailyGoalText">Target: &lt; 2h</span>
    </div>
  </div>

  <div class="controls-list">
    <!-- Option 1: Hide Feed -->
    <div class="control-card">
      <label class="switch-container">
        <div class="label-info">
          <span class="label-title">Hide Home Feed</span>
          <span class="label-desc">Removes thumbnails & algorithmic feed</span>
        </div>
        <input type="checkbox" id="toggleFeed" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Option 2: Hide Shorts -->
    <div class="control-card">
      <label class="switch-container">
        <div class="label-info">
          <span class="label-title">Block Shorts & Reels</span>
          <span class="label-desc">Hides shelves & sidebar shortcuts</span>
        </div>
        <input type="checkbox" id="toggleShorts" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Option 3: Daily Hadith -->
    <div class="control-card">
      <label class="switch-container">
        <div class="label-info">
          <span class="label-title">Daily Hadith (হাদিস ও বাণী)</span>
          <span class="label-desc">Shows inspiring Hadith on homepage</span>
        </div>
        <input type="checkbox" id="toggleQuotes" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Option 4: Auto-Rotate Timer -->
    <div class="control-card">
      <div class="select-container">
        <div class="label-info">
          <span class="label-title">Auto-Rotate (হাদিস পরিবর্তন)</span>
          <span class="label-desc">স্বয়ংক্রিয় পরিবর্তনের সময়সীমা</span>
        </div>
        <select id="selectInterval" class="custom-select">
          <option value="0">Off (ম্যানুয়াল)</option>
          <option value="5">৫ সেকেন্ড</option>
          <option value="10" selected>১০ সেকেন্ড</option>
          <option value="15">১৫ সেকেন্ড</option>
          <option value="30">৩০ সেকেন্ড</option>
          <option value="60">১ মিনিট</option>
        </select>
      </div>
    </div>

    <!-- Option 5: Break Reminder (Option C) -->
    <div class="control-card">
      <div class="select-container">
        <div class="label-info">
          <span class="label-title">Break Alert (বিরতি রিমাইন্ডার)</span>
          <span class="label-desc">টানা দেখার পর সতর্কবার্তা</span>
        </div>
        <select id="selectBreakInterval" class="custom-select">
          <option value="0">Off (বন্ধ)</option>
          <option value="15">১৫ মিনিট</option>
          <option value="20">২০ মিনিট</option>
          <option value="30" selected>৩০ মিনিট</option>
          <option value="45">৪৫ মিনিট</option>
          <option value="60">১ ঘণ্টা</option>
        </select>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="shortcut-tip">
      <kbd>/</kbd> <span>to search instantly on YouTube</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
